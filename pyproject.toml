[project]
name = "siged"
version = "1.0.0"
description = "Sistema Integral de Gestión Documental"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.156.4",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
]

[dependency-groups]
pruebas = ["httpx==0.28.1"]
desarrollo = ["ruff==0.17.3"]
carga = ["locust==2.47.0"]
mensajeria-ws = ["websockets==17.3"]

[tool.uv]
package = false
default-groups = []
