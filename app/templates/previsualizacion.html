<!DOCTYPE html>
<html lang="es" data-tema="{{ usuario['tema'] if usuario else 'automatico' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista previa · {{ nombre_archivo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles-01-variables.css') }}?v=1">
    <style>
        :root { font-family: system-ui, "Segoe UI", Arial, sans-serif; color: var(--color-texto); }
        body { margin: 0; padding: 24px; background: var(--color-fondo); }
        main { max-width: 1100px; margin: 0 auto; padding: 24px; background: var(--color-superficie); border-radius: 10px; }
        h1 { margin-top: 0; font-size: 1.35rem; overflow-wrap: anywhere; }
        .nota { color: var(--color-texto-suave); }
        .contenido-texto { white-space: pre-wrap; overflow-wrap: anywhere; font: 0.98rem/1.6 ui-monospace, Consolas, monospace; }
        .parrafo { white-space: pre-wrap; overflow-wrap: anywhere; }
        .tabla-scroll { overflow: auto; margin: 12px 0 28px; }
        table { border-collapse: collapse; min-width: 100%; }
        td { min-width: 70px; max-width: 360px; padding: 8px 10px; border: 1px solid var(--color-borde-suave); white-space: pre-wrap; overflow-wrap: anywhere; }
        tr:nth-child(even) { background: var(--color-fondo-secundario); }
        .aviso { padding: 14px; border-left: 5px solid var(--color-error); background: var(--color-error-fondo); color: var(--color-error); }
    </style>
</head>
<body>
<main>
    <h1>{{ nombre_archivo }}</h1>
    <p class="nota">Vista de solo lectura.</p>

    {% if error %}
    <p class="aviso" role="alert">{{ error }}</p>
    {% elif extension == ".txt" %}
    <pre class="contenido-texto">{{ texto }}</pre>
    {% endif %}
</main>
</body>
</html>
