<ul id="mensajeria-documentos" data-siguiente="{{ siguiente or '' }}" data-descarga="{{ 'si' if descarga else 'no' }}">
    {% for documento in documentos %}
    <li data-referencia="{{ documento['mensajeria_ref'] }}" data-solo-vista="{{ 'si' if documento['solo_vista'] else 'no' }}">
        <strong>{{ documento['titulo'] }}</strong>
        <span>{{ documento['nombre_archivo'] }}</span>
    </li>
    {% endfor %}
</ul>
