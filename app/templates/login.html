{% extends "base.html" %}

{% block recursos_pagina %}
    <link rel="stylesheet" href="{{ url_for('static', path='icons/phosphor/fill/style.css') }}">
    <script src="{{ url_for('static', path='login.js') }}?v=1" defer></script>
{% endblock %}

{% block contenido %}
<section class="panel-login" aria-labelledby="login-titulo">
    <div class="login-avatar" aria-hidden="true"><i class="ph-fill ph-user"></i></div>
    <h2 id="login-titulo">Iniciar sesión</h2>

    <form class="login-formulario" action="/login" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="login-campo">
            <label class="sr-only" for="usuario">Usuario</label>
            <i class="ph-bold ph-user login-campo-icono" aria-hidden="true"></i>
            <input
                class="login-entrada"
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Usuario"
                maxlength="100"
                autocomplete="username"
                autofocus
                required
            >
        </div>

        <div class="login-campo">
            <label class="sr-only" for="password">Contraseña</label>
            <i class="ph-bold ph-lock-key login-campo-icono" aria-hidden="true"></i>
            <input
                class="login-entrada"
                type="password"
                id="password"
                name="password"
                placeholder="Contraseña"
                maxlength="200"
                autocomplete="current-password"
                required
            >
            <button type="button" id="login-visibilidad" class="login-visibilidad"
                    aria-label="Mostrar contraseña" aria-controls="password" aria-pressed="false" hidden>
                <i class="ph-bold ph-eye-slash" aria-hidden="true"></i>
                <i class="ph-bold ph-eye" aria-hidden="true"></i>
            </button>
        </div>

        <button type="submit" class="login-acceder">Acceder</button>
    </form>
</section>
{% endblock %}
